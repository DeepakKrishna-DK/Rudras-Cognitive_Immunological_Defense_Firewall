[package]
name    = "rudras"
version = "4.0.0"
edition = "2021"
authors = ["Rudras Security"]
description = "Rudras Enterprise Firewall — Cognitive Immunological Defense"

[[bin]]
name = "rudras"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio            = { version = "1",  features = ["full"] }

# CLI argument parsing
clap             = { version = "4",  features = ["derive"] }

# Error handling
anyhow           = "1"

# Serialisation / deserialisation
serde            = { version = "1",  features = ["derive"] }
serde_json       = "1"
toml             = "0.8"

# Logging / tracing
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"

# Network packet parsing
pnet             = "0.35"
pnet_base        = "0.35"
pcap             = "2"

# IP network utilities
ipnetwork        = "0.20"

# Concurrent data structures
parking_lot      = "0.12"
dashmap          = "6"

# HTTP client (threat intel feed downloads)
reqwest          = { version = "0.12", features = ["json", "blocking"] }

# Time
chrono           = { version = "0.4", features = ["serde"] }

# Random numbers
rand             = "0.8"

# UUID
uuid             = { version = "1", features = ["v4"] }

# Regex
regex            = "1"

# Encoding utilities
base64           = "0.22"
hex              = "0.4"

# One-time initialization
once_cell        = "1"
lazy_static      = "1"

# Channel
crossbeam-channel = "0.5"
flume            = "0.11"

# Byte utilities
bytes            = "1"
sysinfo          = "0.38.2"

# Cryptography (Solving Sabotage, Sybil, and Blindness)
sha2             = "0.10"
sha3             = "0.10"
hmac             = "0.12"
rsa              = "0.9"
aes-gcm          = "0.10"
chacha20poly1305 = "0.10"
ed25519-dalek    = { version = "2", features = ["rand_core"] }
x25519-dalek     = "2"
generic-array    = "0.14"

# Matrix / linear algebra for ML features
ndarray          = "0.15"

# Ordered collections for policy verifier
indexmap         = "2"

# HTTP server for management API & health endpoint + WebSocket
axum             = { version = "0.7", features = ["tokio", "ws"] }
tower            = "0.4"
tower-http       = { version = "0.5", features = ["cors", "trace"] }

# DNS parsing for dns_security engine
trust-dns-proto  = "0.23"

# Bloom filter for DNS NRD detection and threat rules engine
bloomfilter      = "1"

# RL policy engine — no external ML dep needed (pure Rust Q-table)
# QUIC/HTTP3 inspector — pure Rust QUIC parsing (no quinn runtime needed)
# Compliance / formal verification — pure logic, no extra deps
# TPM attestation — pure-Rust simulation (real TPM via tpm2-tss-rs if available)
# Homomorphic sharing — Paillier PHE implemented in pure Rust (big integers)
num-bigint       = "0.4"
num-traits       = "0.2"

# Async utilities
futures          = "0.3"

# IP address utility
# (ipnetwork already present)

# Process ID type used in SBOM / UEBA
libc             = "0.2"

# Merkle tree / hash chaining for forensics chain of custody
# (using sha2 + vec for Merkle — no extra dep needed)

# Windows-specific real WFP API surface
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_System_Rpc",
] }

[profile.dev]
opt-level = 0
debug     = true

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
panic         = "abort"
